name: CD
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    env:
      STAGING_KUBECONFIG: ${{ secrets.STAGING_KUBECONFIG }}
    steps:
      - uses: actions/checkout@v4
      - name: Normalize image repository name
        id: image
        run: echo "repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.repository }}-backend:main
            ghcr.io/${{ steps.image.outputs.repository }}-backend:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.repository }}-frontend:main
            ghcr.io/${{ steps.image.outputs.repository }}-frontend:${{ github.sha }}
      - uses: azure/setup-kubectl@v4
        if: ${{ env.STAGING_KUBECONFIG != '' }}
      - name: Configure staging cluster
        if: ${{ env.STAGING_KUBECONFIG != '' }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$STAGING_KUBECONFIG" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Deploy images to staging
        if: ${{ env.STAGING_KUBECONFIG != '' }}
        run: |
          kubectl apply -f deploy/kubernetes/staging.yaml
          kubectl -n ams-staging set image deployment/ams-backend backend=ghcr.io/${{ steps.image.outputs.repository }}-backend:${{ github.sha }}
          kubectl -n ams-staging set image deployment/ams-frontend frontend=ghcr.io/${{ steps.image.outputs.repository }}-frontend:${{ github.sha }}
          kubectl -n ams-staging rollout status deployment/ams-backend --timeout=180s
          kubectl -n ams-staging rollout status deployment/ams-frontend --timeout=180s

